{% extends "inventario/base.html" %}
{% block titulo %}Dar de baja{% endblock %}
{% block contenido %}
<div class="tarjeta">
  <h2>Dar de baja el producto</h2>
  <p>¿Confirma dar de baja <strong>{{ producto }}</strong>? Su historial de movimientos se conserva.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-peligro">Sí, dar de baja</button>
    <a href="{% url 'producto_lista' %}" class="btn btn-sec">Cancelar</a>
  </form>
</div>
{% endblock %}
